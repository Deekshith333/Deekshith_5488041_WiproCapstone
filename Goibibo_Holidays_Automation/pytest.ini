[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/goibibo_holidays_report.html --self-contained-html --alluredir=reports/allure-results
markers =
    positive: valid Goibibo Holidays booking journey until card details boundary
    negative: validation scenarios for invalid traveller/contact data
    smoke: primary end-to-end smoke test
